<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  
  <!-- 阻塞脚本：极致首屏主题检测，防止暗色模式白屏闪烁 (FOUC) -->
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('addressBookSettings');
        const config = saved ? JSON.parse(saved) : {};
        const mode = config.darkMode || 'system';
        const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          // 动态创建临时样式，确保在外部 CSS 加载前背景就是深色的
          const style = document.createElement('style');
          style.id = 'theme-pre-setup';
          style.innerHTML = 'html.dark { background-color: #1f2937 !important; } html.dark body { background-color: #1f2937 !important; color: #f9fafb !important; }';
          document.head.appendChild(style);
        }
      } catch (e) {}
    })();
  </script>

  <!-- PWA相关meta标签 -->
  <meta name="description" content="一个便捷的地址首字母搜索和管理工具">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="地址备忘录">

  
  <!-- manifest.json -->
  <link rel="manifest" href="manifest.json">
  
  <!-- 自定义字体导入统一到 styles.css -->
  
  <title>地址首字母搜索备忘录</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- pinyin-pro 拼音转换库按需加载（移除同步引入以优化首屏） -->
  
  <!-- 引入 Tailwind 编译后的样式文件 -->
  <link rel="stylesheet" href="css/tailwind.css">
  <!-- 引入外部样式文件（在 Tailwind 之后，确保自定义样式覆盖） -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- 空图标占位，避免浏览器请求 /favicon.ico 报错 -->
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y2bYp0AAAAASUVORK5CYII=">
</head>
<body class="bg-gray-50 dark:bg-gray-800 text-dark dark:text-gray-100 no-custom-font font-sans flex flex-col h-[100dvh] overflow-hidden">
  
  <!-- 主要内容区域 -->
  <main class="flex-1 p-4 overflow-hidden flex flex-col min-h-0 h-0">
    <!-- 文本编辑器页面 -->
    <div id="editor-page" class="flex-1 flex flex-col min-h-0 h-full">
      <!-- 文件名显示（隐藏） -->
      <div id="filename-bar" class="p-2 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <div id="filename-display" class="text-sm text-gray-700 dark:text-gray-300 truncate text-center">新备忘录 1</div>
      </div>
      <textarea id="memo-editor" class="w-full flex-1 p-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 focus:border-primary focus:ring focus:ring-blue-200 focus:outline-none resize-none text-dark dark:text-gray-100" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="请输入地址和备注，格式如下：
        地址1
        备注1
        备注2
        
        地址2
        备注1
        
        （地址和备注之间用空行分隔，地址放在第一行，备注放在后续行）"></textarea>
    </div>
    
    <!-- 搜索结果页面 (初始隐藏) -->
    <div id="search-results-page" class="hidden flex-1 flex flex-col min-h-0 h-full">
      
      <!-- 搜索结果列表容器 -->
      <div class="relative flex-1 flex flex-col min-h-0 h-full">
        <!-- 结果计数显示在右上角 -->
        <div class="absolute top-2 right-2 z-10">
          <span id="results-count" class="text-base bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-full font-normal shadow-sm">已找到 0 项</span>
        </div>
        
        <!-- 搜索结果列表容器 -->
        <div id="search-results-list" class="space-y-3 overflow-y-auto flex-1 h-full min-h-0 bg-gray-100 dark:bg-gray-900">
          <!-- 搜索结果将通过JS动态生成 -->
        </div>
        
        <!-- 未找到结果提示 -->
      <div id="no-results-message" class="hidden text-center py-10">
        <p class="text-gray-500 dark:text-gray-400">未找到匹配的地址</p>
        <p class="text-gray-400 dark:text-gray-500 text-sm mt-2">
          建议：尝试其他关键词，或检查输入是否正确
        </p>
      </div>
      </div>
      
      <!-- 关闭按钮放在右下角 -->
      <div id="search-results-close-container" class="hidden">
        <button id="close-search-results" class="text-secondary">关闭</button>
      </div>
    </div>
    
    <!-- 自动保存提示 -->
  <div id="auto-save-indicator" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-black bg-opacity-70 dark:bg-gray-900 dark:bg-opacity-90 text-white px-4 py-2 rounded-lg text-sm z-50 hidden">
    <span id="save-status">已自动保存</span>
  </div>
  </main>
  
  <!-- 底部功能区 -->
  <footer class="bg-white dark:bg-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 flex-none z-10">
    <div class="flex flex-col space-y-4">
      <!-- 搜索框 -->
      <div class="relative">
        <input 
          type="text" 
          id="search-input" 
          placeholder="输入地址首字母搜索（如'bjs'查北京）" 
          class="w-full pl-4 pr-10 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-dark dark:text-gray-100 focus:border-primary focus:ring focus:ring-blue-200 focus:outline-none"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button id="clear-input-btn" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-secondary dark:text-gray-400 hidden px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600">清空</button>
      </div>
      
      <!-- 按钮容器 - 将在搜索页面隐藏 -->
      <div id="action-buttons-container">
        <!-- 操作按钮 -->
        <div class="flex items-center flex-wrap gap-2">
            <div class="flex space-x-1 sm:space-x-2">
              <button id="file-switch-btn" class="px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">文件</button>
              <button id="prev-file-btn" class="px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">上一个</button>
              <button id="next-file-btn" class="px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">下一个</button>
              <button id="scroll-top-btn" class="px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">到最上</button>
              <button id="scroll-bottom-btn" class="px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">到最下</button>
            </div>
            
            <div class="relative ml-auto">
              <button id="secondary-menu-btn" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-blue-600 transition-colors flex items-center">更多</button>
              <div id="secondary-menu" class="hidden absolute bottom-14 right-0 bg-white dark:bg-gray-800 shadow-lg rounded-lg p-2 w-40 z-20">
                <button id="menu-dark-mode-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">暗色模式：自动</button>
                <button id="menu-scroll-on-open-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">加载后滚底部：开</button>
                <button id="menu-password-mode-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">英文键盘模式：关</button>
                <button id="menu-rename-file-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">重命名</button>
                <button id="menu-new-file-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">新建</button>
                <button id="menu-delete-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">删除</button>
                <button id="menu-save-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">保存</button>
                <button id="menu-paste-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">粘贴</button>
                <button id="menu-rename-reset-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">重置文件名</button>
                <button id="menu-sync-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">同步</button>
                <button id="menu-load-font-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">加载字体</button>
                <button id="menu-load-example-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">加载示例</button>
                <button id="menu-log-panel-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">日志面板</button>
                <div class="border-t border-gray-100 dark:border-gray-700 my-1"></div>
                <button id="menu-auto-exit-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-dark dark:text-gray-100 flex items-center">自动退出：1分钟</button>
                <button id="menu-exit-btn" class="w-full py-2 px-3 text-sm rounded hover:bg-red-50 dark:hover:bg-red-900/30 text-red-600 dark:text-red-400 flex items-center">直接退出</button>
              </div>
            </div>
          </div>
      </div>
    </div>
  </footer>
  
  <!-- 文件切换弹窗 -->
  <dialog id="file-popup" class="p-0 bg-transparent backdrop:bg-black/50 w-full max-w-md m-auto rounded-lg shadow-xl open:flex flex-col max-h-[80vh]">
    <div class="bg-white dark:bg-gray-800 rounded-t-lg flex-grow overflow-auto">
      <div class="p-4 border-b dark:border-gray-700">
        <h3 class="text-lg font-medium text-dark dark:text-gray-100">选择文件</h3>
      </div>
      <div id="file-list" class="p-4 space-y-2">
        <!-- 文件列表将通过 JS 动态生成 -->
      </div>
    </div>
    <div class="bg-white dark:bg-gray-800 p-4 rounded-b-lg">
      <button id="close-file-popup" class="w-full py-3 bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 rounded-lg text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
        取消
      </button>
    </div>
  </dialog>
  
  <!-- 地址编辑弹窗 -->
  <dialog id="edit-popup" class="p-0 bg-transparent backdrop:bg-black/50 w-full max-w-md m-auto rounded-lg shadow-xl open:flex flex-col max-h-[80vh]">
    <div class="bg-white dark:bg-gray-800 rounded-lg w-full flex flex-col h-full">
      <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center">
        <h3 class="text-lg font-medium text-dark dark:text-gray-100" id="edit-title">编辑地址</h3>
        <button id="close-edit-popup" class="text-secondary dark:text-gray-400 hover:text-dark dark:hover:text-gray-200">关闭</button>
      </div>
      <div class="p-4 flex-grow overflow-auto">
        <textarea id="edit-content" class="w-full h-48 p-3 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-700 text-dark dark:text-gray-100 rounded-lg text-sm resize-none focus:border-primary focus:ring focus:ring-blue-200 focus:outline-none" placeholder="请输入地址和备注，地址请放在第一行，备注放在后续行"></textarea>
      </div>
      <div class="p-4 border-t dark:border-gray-700 flex space-x-3">
        <button id="delete-address-btn" class="flex-1 py-2 bg-gray-100 dark:bg-gray-700 text-dark dark:text-gray-100 rounded-lg text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
          删除
        </button>
        <button id="save-address-btn" class="flex-1 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition-colors">
          保存
        </button>
      </div>
    </div>
  </dialog>
  
  <!-- 提示消息（初始隐藏） -->
  <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-black bg-opacity-70 dark:bg-gray-900 dark:bg-opacity-90 text-white px-4 py-2 rounded-lg text-sm z-50 hidden">
    <span id="toast-message"></span>
  </div>

  <!-- 引入模块化JavaScript文件 -->
  <script type="module" src="js/app-data.js"></script>
  <script type="module" src="js/ui-utils.js"></script>
  <script type="module" src="js/features.js"></script>
  <script type="module" src="js/app.js"></script>
  
  <!-- 初始化应用 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 延迟初始化以确保所有模块加载完成
      setTimeout(window.initApp, 300);
    });
  </script>
</body>
</html>
